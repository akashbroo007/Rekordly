name: Release

# ponytail: pushing a tag like v0.1.0 builds the Windows installer +
# portable exe on a clean runner and publishes the GitHub Release with the
# artifacts (plus latest.yml/blockmap metadata for future auto-updates).
# Also runnable manually from the Actions tab — the version then comes from
# apps/desktop/package.json and the release is created for it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ponytail: --frozen-lockfile keeps CI on exactly the committed
      # dependency graph; the desktop postinstall runs electron-rebuild for
      # better-sqlite3 against this job's Electron-matching toolchain.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ponytail: vendored yt-dlp + ffmpeg — without these the packaged app
      # ships without a capture engine.
      - name: Fetch vendored binaries (yt-dlp + ffmpeg)
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1

      # ponytail: builds every workspace package in dependency order,
      # including the bundled plugins' dist/ outputs that electron-builder's
      # extraResources copies into the installer.
      - name: Build packages + desktop app
        run: pnpm build

      # ponytail: electron-builder expects apps/desktop/package.json version
      # to match the pushed v-tag (it bakes it into the .exe name and the
      # GitHub Release title). Workspace packages are synced so pnpm cannot
      # choke on a workspace:* mismatch. Guards against tagging the repo at
      # a stale version after a forgot-to-bump mistake.
      - name: Sync package versions with pushed tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG"
          for pkg in apps/desktop/package.json packages/*/package.json; do
            node -e "
              const fs = require('fs');
              const p = '$pkg';
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              if (j.version !== '$TAG') {
                if (!/^(0|1)\\.x$/.test('$TAG')) {
                  console.error('$pkg version ' + j.version + ' does not match tag v$TAG — bump the package versions before tagging.');
                  process.exit(1);
                }
                j.version = '$TAG';
                fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\\n');
                console.log('$pkg -> ' + j.version);
              }
            "
          done

      # ponytail: electron-builder creates the GitHub Release and uploads
      # newest-first (latest.yml -> installer -> portable). If a release for
      # the same tag somehow already exists — e.g. a crashed prior run —
      # uploads can race and GitHub ends up with TWO separate published
      # releases for one tag, splitting the assets across both (seen live:
      # installer/portable in one, a stray .blockmap in a duplicate).
      # Creating the release HERE, exactly once, before electron-builder runs
      # makes electron-builder attach to this release instead of racing to
      # create its own. Non-fatal if creation fails or auth is unavailable —
      # electron-builder still publishes as before.
      - name: Create the GitHub Release for this tag (pre-publish)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          gh release create "$TAG" --title "$VER" --notes "Rekordly $VER — see the full changelog once assets finish uploading." || \
            echo "Release for $TAG not created here (likely already exists) — electron-builder will handle it."

      - name: Package & publish to GitHub Releases
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --publish always
        env:
          # Built-in token — no secret setup needed. electron-builder uses it
          # to create the release for the pushed tag and upload artifacts.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: best-effort copies of the installers for troubleshooting —
      # the real distribution channel is the GitHub Release itself.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: apps/desktop/release/*.exe
          if-no-files-found: warn
          retention-days: 14
