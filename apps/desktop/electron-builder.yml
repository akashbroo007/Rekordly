appId: com.rekordly.app
productName: Rekordly
copyright: Copyright © 2026 Rekordly Contributors

directories:
  output: release
  buildResources: build

# ponytail: GitHub Releases distribution — used by `electron-builder --publish
# always` in .github/workflows/release.yml (GH_TOKEN comes from the workflow).
publish:
  provider: github
  owner: akashbroo007
  repo: Rekordly
  # ponytail: publish directly (not as a draft) so electron-updater sees the
  # release immediately — drafts are invisible to the auto-updater.
  releaseType: release

# ponytail: runtime icon assets (tray / window icon) — resolved by
# src/main/icons.ts via process.resourcesPath in the packaged app.
extraResources:
  # ponytail: filter excludes binaries/ — they get their own top-level
  # entry below (avoiding a 156 MB duplicate inside resources/).
  - from: resources
    to: resources
    filter:
      - "**/*"
      - "!binaries/**"
  # ponytail: built-in plugins are loaded from disk at runtime (PluginLoader
  # requires manifest.json + dist/) — ship them read-only; userData/plugins
  # stays for user-installed ones. Only the built output is needed.
  - from: ../../plugins/
    to: plugins
    filter:
      - "*/dist/**"
      - "*/manifest.json"
  # ponytail: bundled plugins may value-import '@rekordly/plugin-sdk' at
  # runtime (e.g. ProxyRegistry). Plugins live OUTSIDE app.asar with stripped
  # node_modules, so one shared copy ships beside them — Node walks up from
  # resources/plugins/<id>/dist to resources/plugins/node_modules. Its only
  # runtime dependency is zod (everything else in the SDK is type-only).
  # WARNING: any NEW runtime dependency added to the SDK must be added here
  # too — dev works via workspace symlinks and will NOT catch a missing
  # packaged dep (the plugin only fails to load in the installed app).
  - from: ../../packages/plugin-sdk
    to: plugins/node_modules/@rekordly/plugin-sdk
    filter:
      - "package.json"
      - "dist/**"
  - from: ../../packages/plugin-sdk/node_modules/zod
    to: plugins/node_modules/zod
  # ponytail: the stripchat plugin does require('playwright-core') at runtime
  # (MOUFLON decoder). Plugins live OUTSIDE app.asar, so Node cannot resolve
  # the copy inside the asar — ship it next to the plugin instead.
  - from: ../../plugins/stripchat/node_modules/playwright-core
    to: plugins/stripchat/node_modules/playwright-core
  # ponytail: the dreamcam plugin does require('ws') at runtime (VR feed
  # bridge — fmp4s:// WebSocket served back as local HLS). Same asar rule as
  # playwright-core: ship the copy next to the plugin.
  - from: ../../plugins/dreamcam/node_modules/ws
    to: plugins/dreamcam/node_modules/ws
  - from: ../../plugins/dreamcam/node_modules/.pnpm
    to: plugins/dreamcam/node_modules/.pnpm
    filter:
      - "ws@*/node_modules/ws/**"
      - "@types/ws@*/node_modules/@types/ws/**"
  # ponytail: vendored yt-dlp/ffmpeg — end users get a fully working app with
  # zero external installs (resolved via resolveExecutable, see binaries.ts).
  - from: resources/binaries
    to: binaries

files:
  - out/**

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Rekordly

portable:
  artifactName: Rekordly-${version}-portable.exe

extraMetadata:
  main: out/main/index.js
